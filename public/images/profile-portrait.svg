<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lapel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
  </g>

  <!-- Ambient light glow -->
  <circle cx="200" cy="180" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />

  <!-- Suit and Silhouette Body -->
  <g id="silhouette">
    <!-- Shoulders and Coat -->
    <path d="M 60 480 C 70 380, 110 320, 160 300 L 240 300 C 290 320, 330 380, 340 480 Z" fill="url(#suit)" stroke="#334155" stroke-width="1.5" />
    
    <!-- White Shirt Collar -->
    <polygon points="175,300 200,355 225,300 215,285 185,285" fill="#f8fafc" />
    
    <!-- Dark Necktie -->
    <polygon points="194,310 206,310 210,400 200,420 190,400" fill="#090d16" />
    <polygon points="192,305 208,305 204,320 196,320" fill="#1e293b" />

    <!-- Coat Lapels -->
    <path d="M 160 300 L 195 400 L 175 480 L 60 480" fill="url(#lapel)" opacity="0.9" />
    <path d="M 240 300 L 205 400 L 225 480 L 340 480" fill="url(#lapel)" opacity="0.9" />
    
    <!-- Neck -->
    <rect x="184" y="240" width="32" height="50" rx="6" fill="#cbd5e1" opacity="0.85" />

    <!-- Head / Face silhouette contour -->
    <ellipse cx="200" cy="190" rx="62" ry="76" fill="#cbd5e1" opacity="0.9" />
    
    <!-- Hair contour -->
    <path d="M 136 180 C 134 130, 160 110, 200 110 C 240 110, 266 130, 264 180 C 260 155, 245 130, 200 130 C 155 130, 140 155, 136 180 Z" fill="#0f172a" />
    
    <!-- Neat beard / goatee accent inspired by executive photo -->
    <path d="M 185 240 C 185 255, 215 255, 215 240 C 210 248, 190 248, 185 240 Z" fill="#334155" opacity="0.7" />
  </g>

  <!-- Refined Monogram Seal -->
  <g transform="translate(200, 75)">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="24" fill="#1e293b" />
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ZQ</text>
  </g>

  <!-- Professional Tag Plate at Bottom -->
  <g transform="translate(50, 420)">
    <rect width="300" height="42" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
    <text x="150" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">ZAKARIA QURESHI</text>
    <text x="150" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SOFTWARE TEST ENGINEER · BANKING QA</text>
  </g>
</svg>
